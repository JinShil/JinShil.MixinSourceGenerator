name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the published GitHub release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      # Manual runs accept tags that already have a published GitHub release.
      - name: Verify the selected release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag_path="$(node -p 'encodeURIComponent(process.env.RELEASE_TAG)')"
          if ! curl --fail --silent --show-error --output /dev/null \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag_path"; then
            printf '%s\n' '::error::Use the tag of a published GitHub release.'
            exit 1
          fi

      # A manual run loads the workflow from main and builds the selected tag's source.
      - name: Check out the tagged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The generator project packs its NuGet package as part of the test build.
      - name: Test and build the package
        run: dotnet test source/JinShil.MixinSourceGenerator.sln --configuration Release

      - name: Match the package to the release tag
        id: package
        run: |
          version="${RELEASE_TAG#v}"
          package="source/JinShil.MixinSourceGenerator/bin/Release/JinShil.MixinSourceGenerator.${version}.nupkg"
          if [[ ! -f "$package" ]]; then
            printf '::error::Release tag %s must match the NuGet package version.\n' "$RELEASE_TAG"
            exit 1
          fi
          printf 'path=%s\n' "$package" >> "$GITHUB_OUTPUT"

      # NuGet.org exchanges this workflow's identity for a short-lived publishing key.
      - name: Authenticate to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: JinShil

      - name: Publish the package
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "$PACKAGE_PATH"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
